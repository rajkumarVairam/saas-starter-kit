name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  ci:
    name: Type-check · Lint · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Minimal stubs so Next.js env validation doesn't crash the build.
      # Real secrets are NEVER committed — these are CI-only no-ops.
      BASE_URL: "http://localhost:3000"
      DATABASE_URL: "postgresql://user:pass@localhost/db"
      BETTER_AUTH_SECRET: "ci-secret-at-least-32-characters-long"
      GITHUB_CLIENT_ID: "ci-github-client-id"
      GITHUB_CLIENT_SECRET: "ci-github-client-secret"
      GOOGLE_CLIENT_ID: "ci-google-client-id"
      GOOGLE_CLIENT_SECRET: "ci-google-client-secret"
      AI_PROVIDER: "openai"
      POLAR_WEBHOOK_SECRET: "ci-polar-webhook-secret"
      POLAR_ACCESS_TOKEN: "ci-polar-access-token"
      SAASKIT_PRO_PRODUCT_ID: "ci-product-id"
      SENTRY_ORG: ""
      SENTRY_PROJECT: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm tsc --noEmit

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build
